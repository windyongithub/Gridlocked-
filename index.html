    <div class="mailing-list-section">
        <h2>Join the Mailing List</h2>
        <p>Get notified the moment a new puzzle drops.</p>
        <div class="mailing-list-form">
            <input type="email" id="ml-email" placeholder="you@email.com" autocomplete="email">
            <button type="button" id="ml-submit" class="button">Join</button>
            <p id="ml-message"></p>
        </div>
    </div>

    <main>
                <div class="puzzle-header">
            <p class="latest-label">Latest Puzzle</p>
            <h1>Mini 10/26</h1>
            <p class="puzzle-meta">By the and Escher &middot; October 26, 2026</p>
        </div>

        <div class="puzzle-notes" id="notes"></div>
        <script type="text/markdown" id="notes-source">*Constructor Notes*:

**Escher**: The basic idea was the's, but the grid was mine. Enjoy this bite-sized puzzle!

**the**: huge thanks to escher for workshopping my idea! my original puzzle just had the two interlinked three-letter entries, so the revealer part was a nice bonus, plus the removal of superfluous letters! fun fact, this is actually linked to another upcoming puzzle of mine, so stay tuned! ^w^ 🤍🦈🍇</script>

            <iframe title="Puzzmo Embed" src="https://www.puzzmo.com/_embed/latest.html?embedID=gridlocked-october-2026-daily&amp;submissionID=cmuy6jgf01rx01zif0vm7fl26%3APuzzleSubmission" width="100%" height="600px" frameborder="0" loading="lazy" allow="clipboard-write *; web-share *"></iframe>        </div>
            </main>

    <footer>
        <div>gridlockedcrosswords [at] gmail [dot] com</div>
        <div><i>Gridlocked!</i></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script>
        var mdSource = document.getElementById('notes-source');
        var notesEl = document.getElementById('notes');
        if (mdSource && notesEl) {
            notesEl.innerHTML = marked.parse(mdSource.textContent.trim());
        }
    </script>

    <script>
    (function () {
        var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxSRcQyM43p7eYqnAdvrvTz9HcG7AVAC_hw4ipOis_7YrqgLlIlBVkawE8uuIqJ8eB1/exec';

        var emailInput = document.getElementById('ml-email');
        var submitBtn = document.getElementById('ml-submit');
        var messageEl = document.getElementById('ml-message');
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function showMessage(text, isError) {
            messageEl.textContent = text;
            messageEl.style.color = isError ? '#c0392b' : '#2e7d32';
        }

        submitBtn.addEventListener('click', function () {
            var email = emailInput.value.trim();

            if (!emailPattern.test(email)) {
                showMessage('Please enter a valid email address.', true);
                return;
            }

            submitBtn.disabled = true;
            showMessage('Joining...', false);

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ email: email })
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    showMessage(data.message, data.status !== 'success');
                    if (data.status === 'success') emailInput.value = '';
                })
                .catch(function () {
                    showMessage('Something went wrong. Please try again.', true);
                })
                .finally(function () {
                    submitBtn.disabled = false;
                });
        });
    })();
    </script>
</body>
</html>
