**Escher**: The first month of *Gridlocked!* is finally coming to a close! After a few days of back-and-forth, the team decided on using my grid, which I'm extremely happy with. I'm very proud of what we've created as a team, and I hope to continue entertaining the crossworld for the foreseeable future. With the added pressure of college applications and studying for midterm exams, I'm glad to have used my free time doing something constructive. Well, most of it at least.

**zeb**: I'm so honored and grateful to be a part of the incredible team behind *Gridlocked!*. I think the first month was a big success, but I look forward to seeing what's next for us. Big thanks to everybody who has submitted a puzzle to us, helped us with test-solving, and/or given us invaluable guidance and feedback along our journey. As to this puzzle in particular, I think it's awesome and I hope you do too. Thanks for solving!!!

**Kevin**: It's been a great first month at *Gridlocked!*, and I'm proud and thankful to be a member of the editing team here. We've received so many amazing submissions and run so many great puzzles, and I love seeing our community of solvers continue to grow! This puzzle was a really fun collaboration between all of us editors — there's a little bit of each of our personal voices spread throughout the clues. Enjoy solving!

**the**: YIPPEE!!! first month of gridlocked puzzles, without a hitch! i haven't really been particularly active this month, so many, many, MANY thanks to all the other editors, who honestly really carried the slack in editing! special thx to zeb for bringing this project to life! happy solving! ^w^ 👻🎃

**Bryan**: working on Gridlocked has been pretty fun! it's been an interesting experience, and i've enjoyed getting to work on da puzzles + promo work. hopefully there'll be more cool stuff coming out of this little operation in the future! but yeah... nice publication 😂😂 left a like 😊
